services:
  uhf-scheduler:
    image: ghcr.io/marcboy/uhf-scheduler:latest
    container_name: uhf-scheduler
    restart: unless-stopped
    # On Linux / Raspberry Pi, host networking lets mDNS (_uhf-server._tcp)
    # and 127.0.0.1:8085 work natively. On macOS / Windows Docker Desktop,
    # comment out `network_mode: host` and uncomment `ports` + `extra_hosts`.
    network_mode: host
    # ports:
    #   - "${PORT:-8086}:8086"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-8086}
      - UHF_SCHEDULER_DATA_DIR=/data
    volumes:
      - ./data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
